<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MamaCheck Registration</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/registernewmama.css">
    <!--Java script -->
    <script src="js/registration.js" defer></script>
    <link rel="icon" href="images/image 11.svg" type="image/svg+xml">
</head>
<body>

    <div class="container">

        <div class="card">

            <div class="progress-container">
                <div class="progress-bar"></div>
            </div>

            <p class="step">Step 1 of 4</p>

            <h1>Personal Information</h1>

            <p class="subtitle">
                Enter the mother's enrollment details to begin
            </p>

            <form id="registrationForm">

                <input
                    type="text"
                    id="firstName"
                    placeholder="First Name"
                    required
                    
                >
                <input
                    type="text"
                    id="lastName"
                    placeholder="Last Name"
                    required
                >

                <input
                    type="email"
                    id="email"
                    placeholder="Email Address"
                    required
                >

                <div class="phone-group">
                    <span>+234</span>
                    <input
                        type="tel"
                        id="phone"
                        placeholder="Phone Number"
                        required
                        
                    >
                </div>

                <div class="input-icon">
                    <input
                        type="text"
                        id="address"
                        placeholder="Residential Address"
                        required
                        
                    >
                    <span>📍</span>
                </div>

                <input
                    type="text"
                    id="lga"
                    placeholder="LGA"
                    required
                    
                >

                <select id="language" required>
                    <option value="">Preferred Language</option>
                    <option value="english">English</option>
                    <option value="yoruba">Yoruba</option>
                    <option value="igbo">Igbo</option>
                    <option value="hausa">Hausa</option>
                    <option value="pidgin">Pidgin</option>
                </select>

                <button type="submit"
                class="continue-btn">
                    Continue
                </button>

            </form>

        </div>

    </div>
</body>
</html>
