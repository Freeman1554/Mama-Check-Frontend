<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration page 2</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Montserrat:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Boxicons -->
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/registernewmama.css">
    <!--Java script-->
    <script src="js/registration2.js" defer></script>
    <link rel="icon" href="images/image 11.svg" type="image/svg+xml">
</head>
<body>
    <main class="container">
        <section class="container">
            <div class="card">
                <div class="progress-container">
                    <div class="progress-bar2"></div>
                </div>
                <p class="step">Step 2 of 4</p>

                <h1>Pregnancy Details</h1>
                <p class="subtitle">Information used to schedule ANC reminders and monitoring.</p>

                <form id="registration-form2" action="">
                
                <label for="lmp">Last Menstrual Period</label>
                <input type="date"
                    id="lmp"
                    placeholder="DD/MM/YY"
                    
                >
                <label for="edd">Expected Delivery Date</label>
                <div class="menstrualperiod">
                    <input type="date"
                        id="edd"
                         placeholder="Expected Delivery Date"
                    >
                
                </div>
                <label for="clinicName">Nearest PHC/Clinic</label>
                <select id="clinicName">
                    <option value="">select clinic</option>
                    <option>Ota Health center</option>
                    <option>Ikeja Health Center</option>
                    <option>FMC oyo</option>
                    <option>FMC Abia</option>
                    <option>Thompson Hospital</option>
                </select>
                <label for="assignedChew">Assigned CHEW/Nurse</label>
                <input
                    type="text"
                    id="assignedChew"
                    readonly
                >
                <!-- <select id="assignedChew" >
                    <option value=""></option>
                    <option>Dr. Bayo</option>
                    <option>Nurse Tolu</option>
                    <option>Dr. Thanks</option>
                    <option>Nurse Anuoluwapo</option>
                    <option>Nurse Maryam</option>
                </select> -->

                <div class="info-use">
                    <img src="images/lucide_info.svg" alt="">
                    <p>MamaCheck uses this information to calculate weekly reminders and ANC schedules.</p>
                </div>

                <button class="continue-btn"
                    type="submit">
                        Continue
                </button>    
            </form>
            
            
            </div>
        </section>
    </main>
    
</body>
</html>
