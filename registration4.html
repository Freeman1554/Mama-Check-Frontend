<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification Page</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Montserrat:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Boxicons -->
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" integrity="sha384-7ZJ55kZ0QQpfK9/YGYQ4JHlkZbAqzPHJd7w7fZn3A9b0xMoU6g5N5o8S4F9PqXr" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet" integrity="sha384-EjdlOpW64pG5j3bPePpWGcK0E6uJBvg9nShtPsN+YiMzKXWGqOhzLWmxe0bHAw2yh" crossorigin="anonymous">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/registernewmama.css">
    <!--Java script-->
    <script src="js/registration4.js" defer></script>
    <link rel="icon" href="images/image 11.svg" type="image/svg+xml">
</head>
<body>
    <main class="verification">
        <section class="verification">
            <div class="card">
                <div class="progress-container">
                    <div class="progress-bar4"></div>
                </div>
                <p class="step">Step 4 of 4</p>

                <div class="wrap-image">
                    <img src="images/Phone mock up.svg" alt="">
                    <h3>Verify Phone Number</h3>
                    <div class="card-p">
                        <p> Please enter the 6-digit verification code</p>
                        <p>that was sent to? <br> <span id="display-phone">+234 xxx xxx xxxx</span></p>
                    </div>
                </div>
                <div class="verification-container">
    
                <!-- 6-Digit OTP Inputs Group -->
                <div class="otp-container" id="otpGroup">
                    <input type="text" maxlength="1" class="otp-input" autofocus />
                    <input type="text" maxlength="1" class="otp-input" />
                    <input type="text" maxlength="1" class="otp-input" />
                    <input type="text" maxlength="1" class="otp-input" />
                    <input type="text" maxlength="1" class="otp-input" />
                    <input type="text" maxlength="1" class="otp-input" />
                </div>

                <div class="verify-box">
                    <div class="links-container">
                        <a href="#" class="resend-btn"  id="resendOtp">Resend OTP</a>
                        <a href="registration1.html" id="changeNumber">Change phone number</a>
                    </div>

                    <button id="verifyBtn" class="verify-btn">Verify Number</button>
                </div>


    <div class="otp-actions">
    <button
        id="resendBtn"
        type="button"
        class="resend-btn"
        disabled>
        Resend Code
        </button>

        <p id="countdown">Resend code in 60s</p>
        <span id="countdown"></span>
    </div>
            
                
        </section>
    </main> 
    
</body>
</html>
