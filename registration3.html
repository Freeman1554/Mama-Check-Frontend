<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration page</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Montserrat:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Boxicons -->
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/registernewmama.css">
    <!--Java script-->
    <link rel="icon" href="images/image 11.svg" type="image/svg+xml">
    <script src="js/registration3.js" defer></script>
</head>
<body>
    <main class="container">
        <section class="container">
            <div class="card">
                <div class="progress-container">
                    <div class="progress-bar3"></div>
                </div>
                <p class="step">Step 3 of 4</p>

                <h1>Trusted Contact</h1>
                <p class="subtitle">Add a family member or trusted person who can
                     support the mother during emergencies or ANC visits</p>

                <form id="registration-form3">

                <label for="trustedContactName">Trusted Contact Name</label>
                <input
                    type="text"
                    id="trustedContactName"
                    placeholder="Chinedu Okafor"
                
                >

                <select id="relationship" >
                    <option value="">Relationship</option>
                    <option value="Husband">Husband</option>
                    <option value="Father">Father</option>
                    <option value="Mother">Mother</option>
                    <option value="Uncle">Uncle</option>
                    <option value="Aunt">Aunt</option>
                    <option value="Sister">Sister</option>
                    <option value="Brother">Brother</option>
                    <option value="Others">Others</option>
                </select>

                <div class="phone-group">
                    <span>+234</span>
                    <input
                        type="tel"
                        id="trustedContactPhone"
                        placeholder="Phone Number"
                        
                    >
                </div>

                <select id="trustedContactLanguage" required>
                    <option value="">Preferred Language</option>
                    <option value="english">English</option>
                    <option value="yoruba">Yoruba</option>
                    <option value="igbo">Igbo</option>
                    <option value="hausa">Hausa</option>
                    <option value="pidgin">Pidgin</option>
                </select>

                <button class="continue-btn" type="submit">
                    Continue
                </button>

                <button class="skip-btn" type="button">
                    Skip this step
                </button>

            </form>
            </div>       
        </section>
    </main> 

</body>
</html>
